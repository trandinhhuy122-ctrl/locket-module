/*
[Script]
Locket Gold Premium Bypass - 60s Video & Verified Badge
Author: Custom Script

[MITM]
hostname = *.locket.camera, ://locketapi.com

[URL Rewrite]
^https?:\/\/(api\.locketapi\.com|.*\.locket\.camera)\/v\d\/(user\/profile|account\/billing|subscription) script-path=https://githubusercontent.com, requires-body=true, timeout=10, tag=Locket Bypass
*/

// --- ĐOẠN CODE XỬ LÝ (locket.js) ---
let body = $response.body;
if (body) {
    try {
        let obj = JSON.parse(body);

        // 1. Kích hoạt tính năng Locket Gold (Quay 60s, upload ảnh, tính năng Premium)
        if (obj.hasOwnProperty('premium_status') || obj.hasOwnProperty('subscription')) {
            obj.is_premium = true;
            obj.premium_status = "active";
            obj.subscription_type = "gold_yearly";
            obj.expires_date = "2099-12-31T23:59:59Z";
        }

        // 2. Thêm dấu tích xanh (Verified Badge) vào cấu hình tài khoản của bạn
        if (obj.hasOwnProperty('user_profile') || obj.hasOwnProperty('data')) {
            let profile = obj.user_profile || obj.data;
            profile.is_verified = true;
            profile.verified_status = "verified";
            profile.badge_type = "blue_tick";
        }
        
        // Fix bổ sung cho một số phiên bản API mới của Locket
        if (body.indexOf('"is_premium":false') !== -1) {
            body = body.replace(/"is_premium":false/g, '"is_premium":true');
        }
        if (body.indexOf('"is_verified":false') !== -1) {
            body = body.replace(/"is_verified":false/g, '"is_verified":true');
        }

        $done({ body: JSON.stringify(obj) });
    } catch (e) {
        // Nếu lỗi parse JSON thì giữ nguyên gói tin gốc
        $done({});
    }
} else {
    $done({});
}
